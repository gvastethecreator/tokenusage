name: Bug report
description: Report a repeatable TokenUsage problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Every fix starts here. Do not include credentials, prompts, conversations, customer data, or unredacted local paths. Report security issues privately.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or build
      placeholder: Commit hash or package version
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: Provider and version
      description: Complete this field when the problem affects a provider integration.
      placeholder: Cursor 1.2.3 or Codex CLI 0.99.0
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Add redacted logs, CLI output, or screenshots. Remove content, identifiers, credentials, and private paths.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, customer content, identifiers, and private paths.
          required: true
        - label: I searched for an existing issue before opening this report.
          required: true
