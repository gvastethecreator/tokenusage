name: Pricing refresh

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pricing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Prepare the single automation branch
        shell: pwsh
        env:
          BRANCH_NAME: automation/pricing-refresh
        run: |
          $remoteRef = git ls-remote --heads origin $env:BRANCH_NAME
          if ($remoteRef) {
            git fetch origin "+refs/heads/$($env:BRANCH_NAME):refs/remotes/origin/$($env:BRANCH_NAME)"
            git switch --create $env:BRANCH_NAME --track "origin/$($env:BRANCH_NAME)"
            git rebase origin/main
          } else {
            git switch --create $env:BRANCH_NAME
          }

      - name: Refresh official pricing projections
        shell: pwsh
        run: >-
          dotnet run --project src/TokenUsage.Cli/TokenUsage.Cli.csproj
          --configuration Release -- pricing refresh --update
          --output docs/pricing-refresh.md

      - name: Detect a reviewable change
        id: changes
        shell: pwsh
        run: |
          $changed = [bool](git status --porcelain -- docs/pricing-refresh.md)
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Update the automation branch
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          BRANCH_NAME: automation/pricing-refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/pricing-refresh.md
          git commit -m "Review official pricing source changes"
          git push --force-with-lease origin "HEAD:refs/heads/$($env:BRANCH_NAME)"

      - name: Create or update one draft pull request
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/pricing-refresh
        run: |
          $body = @'
          The bounded official-source projections changed.

          Review `docs/pricing-refresh.md`, verify every affected official page,
          and make any catalog or evidence edit manually. This automation never
          changes a price or merges a pull request.
          '@
          $number = gh pr list --state open --head $env:BRANCH_NAME `
            --json number --jq '.[0].number'
          if ($number) {
            gh pr edit $number --title 'Review official pricing source changes' --body $body
          } else {
            gh pr create --draft --head $env:BRANCH_NAME --base main `
              --title 'Review official pricing source changes' --body $body
          }
