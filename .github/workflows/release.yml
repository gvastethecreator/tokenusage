name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.0.1

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TOKENUSAGE_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Add Visual Studio MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Resolve release version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))(?<preview>-preview\.[1-9]\d*)?$') {
              throw 'Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-preview.N.'
            }
            $isPreview = [bool]$Matches['preview']
            "TOKENUSAGE_UNSIGNED_PREVIEW=$($isPreview.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
            $Matches['version']
          } else {
            $env:MANUAL_VERSION
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release version is invalid: $version"
          }
          "TOKENUSAGE_RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Load package certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ($env:TOKENUSAGE_UNSIGNED_PREVIEW -eq 'true') {
            Write-Host 'Unsigned preview: only a portable ZIP will be attached to the pre-release.'
            exit 0
          }
          if (-not $env:CERTIFICATE_BASE64) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              throw 'A tag release requires WINDOWS_CERTIFICATE_BASE64.'
            }
            Write-Host 'No certificate is configured. The workflow will create an unsigned MSIX candidate.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'TokenUsage-release.pfx'
          [System.IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "TOKENUSAGE_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV

      - name: Build release assets
        shell: pwsh
        run: |
          $parameters = @{ Platform = 'x64'; Version = $env:TOKENUSAGE_RELEASE_VERSION }
          if ($env:TOKENUSAGE_UNSIGNED_PREVIEW -eq 'true') {
            $parameters.UnsignedPreview = $true
            $parameters.PackageCertificateKeyFile = ''
            $parameters.PackageCertificatePassword = ''
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $parameters.ReleaseTag = $env:GITHUB_REF_NAME
          }
          .\scripts\release.ps1 @parameters

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TokenUsage-${{ env.TOKENUSAGE_RELEASE_VERSION }}-win-x64
          path: artifacts/release/*
          if-no-files-found: error

      - name: Create draft GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $isPreview = $env:TOKENUSAGE_UNSIGNED_PREVIEW -eq 'true'
          $unsigned = Get-ChildItem artifacts/release -File -Filter '*-unsigned.*'
          if ($unsigned) {
            throw 'A tag release cannot contain an unsigned package.'
          }
          if ($isPreview -and (Get-ChildItem artifacts/release -File | Where-Object Extension -In '.msix','.msixbundle','.appx','.appxbundle')) {
            throw 'An unsigned preview must not contain an MSIX installer.'
          }
          $assets = @(Get-ChildItem artifacts/release -File | Select-Object -ExpandProperty FullName)
          $notes = "docs/releases/$($env:TOKENUSAGE_RELEASE_VERSION).md"
          $repositoryName = $env:GITHUB_REPOSITORY.Split('/')[1]
          $releaseLookup = & gh api graphql -f 'query=query($owner: String!, $name: String!, $tag: String!) { repository(owner: $owner, name: $name) { release(tagName: $tag) { databaseId } } }' `
            -f "owner=$env:GITHUB_REPOSITORY_OWNER" -f "name=$repositoryName" -f "tag=$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) {
            throw 'Existing releases could not be read.'
          }
          $existing = @()
          $releaseId = ($releaseLookup | ConvertFrom-Json).data.repository.release.databaseId
          if ($null -ne $releaseId) {
            $existingJson = & gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
            if ($LASTEXITCODE -ne 0) { throw 'The existing draft could not be read.' }
            $existing = @($existingJson | ConvertFrom-Json)
          }
          if ($existing.Count -eq 1) {
            if (-not $existing[0].draft -or [bool]$existing[0].prerelease -ne $isPreview -or
                $existing[0].target_commitish -cne $env:GITHUB_SHA -or $existing[0].assets.Count -ne 0) {
              throw 'Only an empty draft for this exact commit and channel can be reused. Existing assets are never replaced.'
            }
            $arguments = @('release', 'edit', $env:GITHUB_REF_NAME,
              '--draft', '--title', "TokenUsage $($env:GITHUB_REF_NAME)")
          } else {
            $arguments = @('release', 'create', $env:GITHUB_REF_NAME,
              '--draft', '--verify-tag', '--target', $env:GITHUB_SHA,
              '--title', "TokenUsage $($env:GITHUB_REF_NAME)")
          }
          $arguments += "--prerelease=$($isPreview.ToString().ToLowerInvariant())"
          if (Test-Path -LiteralPath $notes) {
            $arguments += @('--notes-file', $notes)
          } elseif ($existing.Count -eq 1) {
            throw 'Release notes are required to complete an existing draft.'
          } else {
            $arguments += '--generate-notes'
          }
          if ($existing.Count -eq 0) { $arguments += $assets }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
          if ($existing.Count -eq 1) {
            & gh release upload $env:GITHUB_REF_NAME @assets
            if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed. Keep the release unpublished.' }
          }

          $releaseJson = & gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isPrerelease,tagName,assets
          if ($LASTEXITCODE -ne 0) {
            throw 'The draft asset digests could not be read. Do not publish this draft.'
          }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft -or [bool]$release.isPrerelease -ne $isPreview -or $release.tagName -cne $env:GITHUB_REF_NAME) {
            throw 'The uploaded release must remain a draft in the selected channel for manual review.'
          }
          foreach ($assetPath in $assets) {
            $localAsset = Get-Item -LiteralPath $assetPath
            $remoteAssets = @($release.assets | Where-Object { $_.name -ceq $localAsset.Name })
            if ($remoteAssets.Count -ne 1) {
              throw "The draft must contain exactly one asset named $($localAsset.Name)."
            }
            $remoteAsset = $remoteAssets[0]
            $expectedDigest = 'sha256:' + (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remoteAsset.state -ne 'uploaded' -or
                $remoteAsset.size -ne $localAsset.Length -or
                $remoteAsset.digest -ine $expectedDigest) {
              throw "GitHub size or SHA-256 digest mismatch for $($localAsset.Name). Do not publish this draft."
            }
          }
          Write-Host 'Draft asset digests verified. Manual review and publication are still required.'
