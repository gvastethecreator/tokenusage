name: Store readiness

on:
  pull_request:
    paths:
      - '.github/workflows/store-readiness.yml'
      - 'PRIVACY.md'
      - 'docs/store/**'
      - 'scripts/store/**'
      - 'src/TokenUsage.Package/**'
      - 'Directory.Build.props'
  push:
    branches: [main]
    paths:
      - '.github/workflows/store-readiness.yml'
      - 'PRIVACY.md'
      - 'docs/store/**'
      - 'scripts/store/**'
      - 'src/TokenUsage.Package/**'
      - 'Directory.Build.props'
  workflow_dispatch:
    inputs:
      platform:
        description: Store package architecture
        required: true
        type: choice
        default: x64
        options:
          - x64
          - ARM64

permissions:
  contents: read

concurrency:
  group: store-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Store identity and submission files
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Store readiness
        shell: pwsh
        run: .\scripts\store\Test-StoreReadiness.ps1 -EvidencePath artifacts\store-readiness.json

      - name: Upload validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TokenUsage-store-readiness
          path: artifacts/store-readiness.json
          if-no-files-found: error

  build-store-upload:
    name: Build Store upload candidate
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Add Visual Studio MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build Store upload candidate
        shell: pwsh
        run: .\scripts\store\Build-StoreUpload.ps1 -Platform '${{ inputs.platform }}'

      - name: Upload Store review bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TokenUsage-store-${{ inputs.platform }}-${{ github.sha }}
          path: artifacts/store/${{ inputs.platform == 'ARM64' && 'arm64' || 'x64' }}/**
          if-no-files-found: error
          retention-days: 14
